# =============================================================================
# Wails Auto-Update Template — GitHub Actions Workflow
# =============================================================================
# Este workflow compila a aplicação Wails para múltiplas plataformas e — quando
# uma tag v* é empurrada — publica um GitHub Release com os binários prontos
# para o auto-updater interno.
#
# Gatilhos:
#   - Push para main         → apenas compila (validação).
#   - Push de tag v*          → compila + publica release.
#
# Convenção de nomenclatura dos assets (consumida pelo updater):
#   <repo>_<GOOS>_<GOARCH>[.exe]            binário
#   <repo>_<GOOS>_<GOARCH>[.exe].sha256     checksum SHA-256
#
# Uso:
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
# =============================================================================

name: Build e Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Instalar dependências (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Instalar dependências (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Instalar dependências do frontend
        run: cd frontend && npm install && cd ..

      - name: Extrair versão
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION=$(grep 'var version = ' version.go | sed 's/.*"\([^"]*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -platform ${{ matrix.goos }}/${{ matrix.goarch }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          wails build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -platform windows/amd64 \
            -nsis

      - name: Preparar binário (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_NAME="${{ github.event.repository.name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          SRC="build/bin/${{ github.event.repository.name }}.app/Contents/MacOS/${{ github.event.repository.name }}"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$APP_NAME"
          else
            # fallback: procurar qualquer app bundle
            BUNDLE=$(find build/bin -name '*.app' -type d | head -1)
            if [ -n "$BUNDLE" ]; then
              cp "$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .app)" "$APP_NAME"
            else
              echo "::error::macOS binary not found in build/bin/"
              exit 1
            fi
          fi
          echo "BINARY_PATH=$APP_NAME" >> "$GITHUB_ENV"

      - name: Preparar binário (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APP_NAME="${{ github.event.repository.name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          SRC="build/bin/${{ github.event.repository.name }}"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$APP_NAME"
            chmod +x "$APP_NAME"
          else
            echo "::error::Linux binary not found in build/bin/"
            exit 1
          fi
          echo "BINARY_PATH=$APP_NAME" >> "$GITHUB_ENV"

      - name: Preparar binário (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $AppName = "${{ github.event.repository.name }}_${{ matrix.goos }}_${{ matrix.goarch }}.exe"
          $Src = "build\bin\${{ github.event.repository.name }}.exe"
          Copy-Item $Src $AppName
          echo "BINARY_PATH=$AppName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gerar checksum
        shell: bash
        run: |
          sha256sum "${{ env.BINARY_PATH }}" > "${{ env.BINARY_PATH }}.sha256"

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            ${{ env.BINARY_PATH }}
            ${{ env.BINARY_PATH }}.sha256
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Estruturar arquivos para release
        shell: bash
        run: |
          mkdir -p release
          # artifacts/<artifact-name>/ contém os arquivos
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          ls -la release/
          echo "---"
          echo "Arquivos no diretório release:"
          find release -type f

      - name: Extrair notas de release
        id: release_notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Lançamento automático para $VERSION" > release_notes.md
          echo "" >> release_notes.md
          echo "## Arquivos de Download" >> release_notes.md
          echo "" >> release_notes.md
          cd release
          for file in *.sha256; do
            [ -f "$file" ] || continue
            binary="${file%.sha256}"
            checksum=$(cat "$file" | awk '{print $1}')
            echo "- **$binary** (SHA256: \`${checksum:0:16}...\`)" >> ../release_notes.md
          done

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}